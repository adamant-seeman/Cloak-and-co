<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloäk & Co. | Collections</title>
  <meta name="description"
    content="Explore our premium collections of designer phone cases. Crafted with Timeless elegance and military-grade protection to protect what matters.">

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet">

  <!-- Shared index styles & Collections specific styles -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/collections.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
</head>

<body>

  <div id="navbar"></div>

  <!-- Ambient Glowing Background Blobs (CSS Only) -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Collections Main Container -->
  <main class="collections-main">

    <!-- Hero Section -->
    <section class="collections-hero">
      <!-- Sparkle SVGs for Apple-like clean decoration -->
      <div class="sparkle sparkle-1">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z"
            fill="rgba(139, 120, 168, 0.4)" />
        </svg>
      </div>
      <div class="sparkle sparkle-2">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z"
            fill="rgba(139, 120, 168, 0.3)" />
        </svg>
      </div>

      <h1 class="collections-title">Collections</h1>
      <p class="collections-subtitle">Explore premium phone case designs crafted to protect what matters.</p>
    </section>

    <!-- Product Grid Section -->
    <section class="grid-section">
      <div class="collections-container">

        <!-- Procedural grid loader -->
        <div id="collections-grid" class="collections-grid">
          <!-- Dynamically loaded product cards will be appended here -->
        </div>

        <!-- Empty state warning modal -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="9" cy="9" r="2" />
              <path d="M21 15l-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
            </svg>
          </div>
          <h3 class="empty-title">No Case Designs Found</h3>
          <p class="empty-message">No case designs found. Please check the case design folder path.</p>
        </div>

      </div>
    </section>

    <!-- Final CTA Section -->
    <section class="collections-cta">
      <h2 class="cta-heading">Ready to protect what matters?</h2>
      <a href="index.html#shop" class="cta-btn">Shop Now</a>
    </section>

  </main>

  <div id="footer"></div>

  <!-- Collections scripting -->
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/collections.js"></script>
</body>

</html>
